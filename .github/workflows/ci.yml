name: MLOps CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  quality-check:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      - name: Install dependencies
        run: |
          make install


      - name: Run linting
        run: |
          make lint


      - name: Run unit tests
        run: |
          make test